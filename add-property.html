
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property | HOMELAND</title>
    <link rel="stylesheet" href="auth.css">

    <style>
        .property-form-card {
            max-width: 650px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-grid .form-group {
            margin-bottom: 4px;
        }

        @media(max-width: 550px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<main class="auth-page">
    <div class="auth-card property-form-card">

        <a href="user-dashboard.html" class="auth-logo">HOMELAND.</a>

        <h1>Add New Property</h1>
        <p class="auth-subtitle">Enter your property information below.</p>

        <form id="propertyForm">

            <div class="form-group">
                <label for="propertyName">Property Name</label>
                <input type="text" id="propertyName"
                    placeholder="Example: Luxury Family Villa" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location"
                    placeholder="Example: Hyderabad" required>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price" min="1"
                        placeholder="8500000" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose</label>
                    <select id="purpose" required>
                        <option value="">Select purpose</option>
                        <option value="Buy">Buy</option>
                        <option value="Rent">Rent</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="type">Property Type</label>
                    <select id="type" required>
                        <option value="">Select type</option>
                        <option value="House">House</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Villa">Villa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bedrooms">Bedrooms</label>
                    <input type="number" id="bedrooms"
                        min="0" placeholder="3" required>
                </div>

                <div class="form-group">
                    <label for="bathrooms">Bathrooms</label>
                    <input type="number" id="bathrooms"
                        min="0" placeholder="2" required>
                </div>

                <div class="form-group">
                    <label for="area">Area (sq.ft.)</label>
                    <input type="number" id="area"
                        min="1" placeholder="2400" required>
                </div>
            </div>

            <div class="form-group">
                <label for="image">Property Image URL</label>
                <input type="url" id="image"
                    placeholder="https://example.com/image.jpg" required>
            </div>

            <button type="submit" class="auth-button">
                Add Property
            </button>

            <p id="propertyMessage" class="auth-message"></p>

        </form>

        <a href="user-dashboard.html" class="back-home">
            ← Back to Dashboard
        </a>

    </div>
</main>

<script src="property-form.js"></script>
</body>
</html>
