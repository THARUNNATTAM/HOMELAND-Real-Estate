
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details | HOMELAND</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .details-container {
            max-width: 1050px;
            margin: 45px auto;
            padding: 20px;
        }

        .details-image {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 15px;
        }

        .details-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .details-content h1 {
            color: #246b45;
            margin-bottom: 12px;
        }

        .details-price {
            font-size: 26px;
            font-weight: 800;
            margin: 18px 0;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .detail-item {
            background: #f4f7f3;
            padding: 18px;
            border-radius: 10px;
        }

        .detail-item p {
            color: #78847c;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .detail-item h3 {
            color: #246b45;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #246b45;
            text-decoration: none;
            font-weight: 600;
        }

        .not-found {
            text-align: center;
            padding: 60px 20px;
        }

        @media(max-width: 600px) {
            .details-image {
                height: 250px;
            }

            .details-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="details-container">

        <a href="index.html" class="back-link">
            ← Back to Properties
        </a>

        <div id="propertyDetails">
            Loading property details...
        </div>

    </main>

    <script src="property-details.js"></script>

</body>
</html>
